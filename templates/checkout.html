{% extends "base.html" %}
{% block title %}Checkout{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h2 class="fw-bold">Pembelian Buku</h2>
                    <p class="text-muted">{{ buku.judul }}</p>
                    <h3>Rp{{ buku.harga }}</h3>

                    {% if error %}
                        <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}

                    <form method="POST" class="mt-4">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Nama *</label>
                            <input type="text" name="nama" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Nomor WhatsApp</label>
                            <input type="text" name="whatsapp" class="form-control" placeholder="08xxxxxxxxxx">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control">
                        </div>

                        <button class="btn btn-warning w-100 btn-lg">Lanjut Pembayaran</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
